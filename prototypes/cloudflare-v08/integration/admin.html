<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/"><title>SSF 管理者班表預覽</title><link rel="stylesheet" href="/admin.css">
<script src="/vendor/sheetjs/xlsx.full.min.js" defer></script><script src="/js/schedule-model.js" defer></script><script src="/js/schedule-validator.js" defer></script><script src="/js/pdf-parser.js" defer></script><script src="/js/excel-parser.js" defer></script><script src="/js/import-confirmation.js" defer></script><script src="/admin-auth.js" defer></script><script src="/admin.js" defer></script></head>
<body><main><header><h1>管理者班表預覽 · Phase 4A</h1><a href="/admin/login">重新登入</a> <button id="admin-logout">登出並清除預覽</button><p id="admin-status" role="status" aria-live="polite">正在確認管理者登入狀態…</p></header>
<div class="upload"><label for="admin-file">選擇 PDF／Excel 班表</label><input id="admin-file" type="file" accept=".pdf,.xlsx,.xls" disabled><p>原始檔案只在此瀏覽器解析，重新整理或登出即清除。本階段無法發布。</p><label id="sheet-picker" hidden>工作表 <select id="admin-sheet"></select><button id="parse-sheet">解析此工作表</button></label><p id="import-status" role="status" aria-live="polite">尚未匯入</p></div>
<section aria-labelledby="cycle-heading"><h2 id="cycle-heading">1. 四週期起訖日期</h2><label>起始日期 <input id="admin-cycle-start" type="date" disabled></label><span>結束日期 <output id="admin-cycle-end">—</output></span><p id="cycle-proposal">匯入後提供建議，仍需管理者確認。</p><button id="admin-confirm-cycle" disabled>確認四週期</button><p id="cycle-status" role="status"></p></section>
<section aria-labelledby="error-heading"><h2 id="error-heading">2. 未解決的關鍵錯誤</h2><div id="admin-errors" role="status">尚未匯入</div></section>
<section aria-labelledby="preview-heading"><h2 id="preview-heading">3. 完整班表預覽（唯讀）</h2><p>藍色欄位為正式四週期；灰色欄位為週期外日期，保留供計算使用。儲存格可檢視來源文字，不可編輯。</p><div id="admin-preview" class="preview" tabindex="0" aria-label="完整班表，可水平捲動"></div></section>
<section aria-labelledby="publish-heading"><h2 id="publish-heading">4. 確認發布</h2><button id="admin-publish" disabled>確認發布（Phase 4A 尚未開放）</button><p>本階段沒有發布 API，即使驗證通過也不會寫入單位班表。</p></section></main></body></html>
